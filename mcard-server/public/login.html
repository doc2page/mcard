<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png" type="image/png">
<title>MCard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14171c; color: #e6e8eb; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding: 20px; }
  .card { width: 100%; max-width: 320px; background: #1a1d24; border: 1px solid #2a2f38; border-radius: 14px; padding: 28px 24px; box-shadow: 0 10px 40px -12px rgba(0,0,0,0.5); }
  .logo { text-align: center; margin-bottom: 18px; }
  .logo-img { width: 56px; height: 56px; border-radius: 13px; }
  .logo-title { font-size: 17px; font-weight: 700; margin-top: 12px; letter-spacing: 0.02em; }
  .logo-sub { font-size: 10.5px; color: #8b94a3; letter-spacing: 0.06em; margin-top: 3px; }
  label { display: block; font-size: 12px; color: #8b94a3; margin: 18px 0 6px; }
  input { width: 100%; padding: 10px 12px; background: #14171c; border: 1px solid #2a2f38; border-radius: 8px; color: #e6e8eb; font-size: 14px; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: #f5a623; }
  button { width: 100%; margin-top: 16px; padding: 10px; background: #f5a623; color: #1a1d24; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.12s; }
  button:hover { background: #ffb840; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .err { color: #e0453a; font-size: 12px; margin-top: 10px; text-align: center; min-height: 16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">
      <img class="logo-img" src="logo.png" alt="MCard">
      <div class="logo-title">MCard</div>
      <div class="logo-sub">Make it easy</div>
    </div>
    <label for="pw" id="pwLabel">访问密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="btn">登录</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    // 浏览器语言自适应：中文显中文，其它显英文
    var zh = /^zh\b/i.test(navigator.language || '');
    var I = zh
      ? { pwLabel: '访问密码', btn: '登录', wrong: '密码错误', net: '网络错误' }
      : { pwLabel: 'Access password', btn: 'Log in', wrong: 'Wrong password', net: 'Network error' };
    document.getElementById('pwLabel').textContent = I.pwLabel;
    document.getElementById('btn').textContent = I.btn;
    document.documentElement.lang = zh ? 'zh' : 'en';

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('btn');
      var err = document.getElementById('err');
      var pw = document.getElementById('pw').value;
      btn.disabled = true; err.textContent = '';
      try {
        var r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
        if (r.ok) { location.href = '/'; }
        else { err.textContent = I.wrong; btn.disabled = false; document.getElementById('pw').select(); }
      } catch (ex) { err.textContent = I.net; btn.disabled = false; }
    });
  </script>
</body>
</html>
